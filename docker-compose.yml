services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PITCHSIDE_DB_PATH=/data/pitchside.duckdb
    env_file:
      - ./backend/.env
    volumes:
      - db-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
